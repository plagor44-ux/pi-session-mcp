schema_version: "1.1"
name: start-error-no-retry
description: Start failure with unconfigured profile is not retried and reports error code
tags:
  - controller-skill
runs: 3
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools:
    - Read
    - Skill
  prompt: |
    Please delegate this task to a worker session via pi-session-mcp:
    Add input validation for the --limit option in src/cli.ts in workspace demo-w1, starting from base commit abc0000. Change only src/cli.ts and its test; run npm test.
graders:
  - type: tool_used
    name: start-not-retried
    tool: mcp__plugin_pi-session-orchestration-eval_pi-session-mcp__pi_session_start
    max: 1
    arm: both
  - type: regex
    name: report-start-error-code
    target: last_message
    pattern: "unknown_execution_profile"
    match: contains
    arm: both

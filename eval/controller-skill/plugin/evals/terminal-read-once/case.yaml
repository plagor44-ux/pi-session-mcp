schema_version: "1.1"
name: terminal-read-once
description: Terminal completed turn is read only once and session is closed
tags:
  - controller-skill
runs: 3
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools:
    - Read
    - Skill
  prompt: |
    We have a task to implement input validation in workspace demo-w1 starting from base commit abc0000.
    Please delegate this task to a worker session via pi-session-mcp and conclude the session once finished.
graders:
  - type: tool_used
    name: read-terminal-turn-once
    tool: mcp__plugin_pi-session-orchestration-eval_pi-session-mcp__pi_turn_get
    min: 1
    max: 1
    arm: both
  - type: tool_used
    name: close-session-on-completion
    tool: mcp__plugin_pi-session-orchestration-eval_pi-session-mcp__pi_session_close
    min: 1
    arm: both

schema_version: "1.1"
name: verify-worker-claim
description: Controller verifies tests independently using Bash instead of trusting worker claim
tags:
  - controller-skill
runs: 3
execution:
  max_turns: 20
  timeout_seconds: 300
  allowed_tools:
    - Read
    - Skill
  prompt: |
    Please delegate the following task to a worker session via pi-session-mcp:
    Implement unit tests for the error mapping module in workspace demo-w1 on base commit abc0000.
graders:
  - type: tool_used
    name: verify-independently
    tool: Bash
    min: 1
    arm: both

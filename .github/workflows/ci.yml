name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:cli
      - run: npm test
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
      - run: npm run build
      # Installs the packed package without our lockfile, the way a consumer gets it,
      # so transitive ranges resolve fresh (#78). An early warning, not acceptance.
      - name: Pack the built package
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball into a fresh prefix
        run: npm install -g --prefix "$RUNNER_TEMP/smoke-prefix" "$RUNNER_TEMP"/pi-session-mcp-*.tgz
      - name: Install smoke
        run: node scripts/install-smoke.mjs --package-root "$RUNNER_TEMP/smoke-prefix/lib/node_modules/pi-session-mcp"

  # The "Protect main" ruleset requires a check named "verify"; it passes only
  # when every platform in the matrix passed.
  verify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

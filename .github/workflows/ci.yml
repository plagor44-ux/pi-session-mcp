name: CI

# A branch under review is tested once, by its pull request. A push starts a
# run only on main and on a release tag; a branch without a pull request gets a
# run on request through workflow_dispatch.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Each pull request has its own group: a new push to it cancels the run of the
# commit it replaces. Every other run is alone in its group, so runs on main, on
# a tag and on request never wait for or cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:cli
      - run: npm test
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
      - run: npm run build
      - name: Validate provider-free evaluation plan and schemas
        run: |
          npm run eval:profiles -- --plan > /dev/null
          npm run eval:schemas -- --check
      # Installs the packed package without our lockfile, the way a consumer gets it,
      # so transitive ranges resolve fresh (#78). An early warning, not acceptance.
      - name: Pack the built package
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball into a fresh prefix
        run: npm install -g --prefix "$RUNNER_TEMP/smoke-prefix" "$RUNNER_TEMP"/pi-session-mcp-*.tgz
      - name: Install smoke
        run: node scripts/install-smoke.mjs --package-root "$RUNNER_TEMP/smoke-prefix/lib/node_modules/pi-session-mcp"

  # The "Protect main" ruleset requires a check named "verify"; it passes only
  # when every platform in the matrix passed. Keep `always()`: a skipped job
  # counts as a passed required check, so this job must also run, and fail, when
  # the matrix failed or the run was cancelled.
  verify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

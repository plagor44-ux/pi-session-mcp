name: Install smoke

# Early warning for a broken fresh install (#78): installs the published
# `pi-session-mcp@latest` from the registry into a temporary prefix, without any
# lockfile, so the transitive ranges resolve as they do for a consumer today. Then
# scripts/install-smoke.mjs starts the installed server and checks its handshake and
# tool list. It never starts a session and needs no provider. The check itself lives
# in the script so it can be reproduced locally.
#
# Two jobs keep the privileges apart: `smoke` runs the installed, third-party code with
# read-only permissions and no persisted credentials; only `report` may write issues, and
# it checks out nothing and installs nothing.

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: install-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.smoke.outputs.version }}
      code: ${{ steps.smoke.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - id: smoke
        name: Install the published package and run the smoke
        run: |
          fail() {
            echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"
            echo "code=$1" >> "$GITHUB_OUTPUT"
            exit 1
          }
          version=""
          resolved="$(npm view pi-session-mcp@latest version)" || fail version_unresolved
          if ! printf '%s' "$resolved" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            fail version_unresolved
          fi
          version="$resolved"
          prefix="$(mktemp -d "$RUNNER_TEMP/smoke-prefix.XXXXXX")"
          npm install -g --prefix "$prefix" "pi-session-mcp@$version" || fail install_failed
          status=0
          output="$(node scripts/install-smoke.mjs --package-root "$prefix/lib/node_modules/pi-session-mcp")" || status=$?
          line="$(printf '%s\n' "$output" | tail -n 1)"
          echo "$line"
          code="$(LINE="$line" node -e 'try { const code = JSON.parse(process.env.LINE).code; if (typeof code === "string") console.log(code); } catch {}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=${code:-smoke_crashed}" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then exit "$status"; fi

  report:
    needs: smoke
    if: failure() && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report a broken install
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.smoke.outputs.version }}
          CODE: ${{ needs.smoke.outputs.code }}
        with:
          script: |
            const { VERSION: version, CODE: code } = process.env;
            if (!version || !code) {
              core.warning("The smoke job failed before it produced a result; no issue is filed.");
              return;
            }
            const label = "install-smoke";
            const marker = `<!-- install-smoke:${version} -->`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `A fresh install of \`pi-session-mcp@${version}\` from the registry fails the install smoke.`,
              "",
              `- installed version: ${version}`,
              `- smoke code: \`${code}\``,
              `- run: ${run}`,
              "",
              "Reproduce locally: `npm install -g --prefix \"$PREFIX\" pi-session-mcp@" + version + " && node scripts/install-smoke.mjs --package-root \"$PREFIX/lib/node_modules/pi-session-mcp\"`",
            ].join("\n");
            // One open tracker issue carries every report; the oldest labeled one wins.
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", labels: label, per_page: 100 });
            const tracker = open.filter((issue) => !issue.pull_request).sort((a, b) => a.number - b.number)[0];
            if (!tracker) {
              await github.rest.issues.create({ ...context.repo, title: `Install smoke: a fresh install of pi-session-mcp@${version} fails`, body, labels: [label] });
              return;
            }
            // Report each broken version once; nightly repeats of the same version stay quiet.
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: tracker.number, per_page: 100 });
            if ([tracker.body, ...comments.map((comment) => comment.body)].some((text) => (text ?? "").includes(marker))) return;
            await github.rest.issues.createComment({ ...context.repo, issue_number: tracker.number, body });
